<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">&times;</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Vorheriges Bild">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" aria-label="Nächstes Bild">&#8250;</button>
</div>

<script>
(function() {
  var items = Array.prototype.slice.call(document.querySelectorAll('#masonry img'));
  var overlay = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightboxImg');
  var idx = 0;

  function show(i) {
    idx = (i + items.length) % items.length;
    lbImg.src = items[idx].src;
    lbImg.alt = items[idx].alt;
  }
  function open(i) {
    show(i);
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  items.forEach(function(img, i) {
    img.parentElement.addEventListener('click', function() { open(i); });
  });
  document.getElementById('lightboxClose').addEventListener('click', close);
  document.getElementById('lightboxPrev').addEventListener('click', function(e) { e.stopPropagation(); show(idx - 1); });
  document.getElementById('lightboxNext').addEventListener('click', function(e) { e.stopPropagation(); show(idx + 1); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function(e) {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });
})();
</script>
